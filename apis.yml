      - type: Sandbox
        url: sandbox/otis-worldwide-sandbox.yml
      - type: RateLimits
        url: rate-limits/otis-worldwide-rate-limits.yml
  - name: Otis Building Management API
    description: >-
      API that moves elevator and escalator data into Building Management Systems (BMS), Building
      Automation Systems (BAS) and SCADA platforms — real-time equipment status, notifications and
      alerts, waiting-time and call analytics, trip origin and destination — and accepts operational
      commands including hall calls, car calls, operating modes, alarms, scheduled floor lock-outs
      and emergency modes such as security lockdown.
    humanURL: https://www.otis.com/en/us/building-management-api
    baseURL: https://api.otis.com
