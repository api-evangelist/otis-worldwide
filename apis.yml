apis:
  - name: Otis Integrated Dispatch (OID) API
    description: >-
      Cloud-based or on-premise API for integrating service robots and third-party applications with
      Otis elevators. Otis's own service-robot data sheet lists the available operations as: place a
      hall call, place a car call, place a destination call, get car and door information (car
      position, direction of travel, load, door status, car mode), building and elevator metadata,
      and authentication. Transport is secure websockets over TLS 1.2 with OAuth 2.0 client
      credentials, and an API sandbox environment is offered for pre-deployment testing.
    humanURL: https://www.otis.com/en/us/products-services/products/otis-integrated-dispatch
    baseURL: https://api.otis.com
    tags:
      - Elevator Dispatch
      - Robotics
      - Building Automation
      - WebSockets
