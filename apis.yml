description: >-
  Otis Worldwide is the world's leading manufacturer, installer and servicer of elevators, escalators
  and moving walkways, serving customers in more than 200 countries and territories. Alongside the
  equipment business Otis runs a connected-building software portfolio — Otis ONE IoT remote
  monitoring, the Compass destination-entry dispatch platform, eCall and eView — and exposes it to
  integrators through the Otis Developer Portal at developers.otis.com. Two named API products sit
  behind that portal: the Otis Integrated Dispatch (OID) API, a secure-websocket, OAuth 2.0
  client-credentials interface that lets service robots and third-party applications place hall,
  car and destination calls and read live car position, direction, load, door status and car mode;
  and the Building Management API, which streams elevator and escalator availability, traffic and
  maintenance data into BMS, BAS and SCADA platforms and accepts operational commands. Otis also
  publishes an eCall Pro API. The developer portal is an Azure API Management instance and its API
  catalogue is visible only to signed-in, subscribed developers, so no public OpenAPI, AsyncAPI or
  other machine-readable contract is reachable anonymously.
