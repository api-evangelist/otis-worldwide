  domain_standards:
    market: Elevator, escalator and building-automation integration
    declared: false
    summary: >-
      This market does have integration standards a vertical-transportation API could speak — BACnet
      and its BACnet/WS web-services profile (ASHRAE 135) and Modbus are the lingua franca of
      building automation, and OPC UA appears in industrial deployments. Otis's own API material
      names none of them: the Building Management API is described as pushing data INTO a BMS/BAS/
      SCADA system, and the OID API as a proprietary secure-websocket interface, with no BACnet
      object model, BACnet/WS surface, Modbus register map or OPC UA information model declared
      anywhere public.
